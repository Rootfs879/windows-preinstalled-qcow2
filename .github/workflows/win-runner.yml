name: Windows Tailscale with OpenSSH
on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Setup Windows OpenSSH Server
        shell: pwsh
        run: |
          Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0

          Start-Service sshd
          Set-Service -Name sshd -StartupType Automatic
          
          $password = "n0P4sswD!"
          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $securePassword
          
          Write-Host "Tailscale IP for this runner:"
          tailscale ip -4
          Write-Host "Username: runneradmin"
          Write-Host "Password: n0P4sswD!"

      - name: Wait for Debugging Session
        shell: pwsh
        run: |
          Start-Sleep -Seconds 21600
