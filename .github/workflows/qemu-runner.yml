name: QEMU x86_64 Runner

on:
  workflow_dispatch: 
    inputs:
      inst_qemu_x64:
        type: boolean
        description: 'Install QEMU x86_64'
        default: false
        
jobs:
  debug-runner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Connect to Tailnet & Enable SSH
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          args: --ssh

      - name: Installing QEMU for This Architecture
        if: ${{ inputs.inst_qemu_x64 }}
        run: |
          sudo apt install qemu-system-x86

      - name: Skip Installing QEMU
        if: ${{ !inputs.inst_qemu_x64 }}
        run: |
          echo "Skipped."
          
      - name: Installing QEMU Utility
        run: |
          sudo apt install qemu-utils -y

      - name: Create /runner-artifact directory
        run: |
          sudo mkdir -p /runner-artifact
          sudo chmod 777 /runner-artifact

      - name: Turning on NBD module
        run: |
          sudo modprobe nbd

      - name: Display Connection Info
        run: |
          RUNNER_IP=$(tailscale ip -4)
          echo "Run this in your terminal: ssh runner@$RUNNER_IP"
          echo "If you are completed on doing something and want to upload the artifact, run: touch /tmp/continue"

      - name: Hold Execution for SSH
        run: |
          while [ ! -f /tmp/continue ]; do
            sleep 5
          done

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          # Artifact name. If the `archive` input is `false`, the name of the file uploaded will be the artifact name.
          name: artifact # optional, default is artifact
          # A file, directory or wildcard pattern that describes what to upload.
          path: /runner-artifact/*

          include-hidden-files: false # optional, default is false
          # If true, the artifact will be archived (zipped) before uploading. If false, the artifact will be uploaded as-is without archiving. When `archive` is `false`, only a single file can be uploaded. The name of the file will be used as the artifact name (ignoring the `name` parameter).

          archive: true # optional, default is true
