name: QEMU x86_64 Runner

on:
  workflow_dispatch: 
    inputs:
      inst_qemu_x64:
        type: boolean
        description: 'Install QEMU x86_64'
        default: true
      inst_qemu_ppc:
        type: boolean
        description: 'Install QEMU PPC (PowerPC)'
        default: false
      inst_qemu_arm:
        type: boolean
        description: 'Install QEMU ARM'
        default: false
      inst_xfce:
        type: boolean
        description: 'Install XFCE'
        default: false
      inst_vnc:
        type: boolean
        description: 'Install VNC Server'
        default: true
      inst_vm_man:
        type: boolean
        description: 'Install Virt-Manager'
        default: true

jobs:
  debug-runner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Connect to Tailnet & Enable SSH
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          args: --ssh

      - name: Create Custom Command
        run: |
          sudo cat <<EOF > /usr/local/bin/update
          sudo apt update
          EOF

          sudo cat <<EOF > /usr/local/bin/clean
          sudo apt clean
          EOF

          sudo cat <<EOF > /usr/local/bin/autoclean
          sudo apt autoclean
          EOF

          sudo cat <<EOF > /usr/local/bin/autorm-w-purge
          sudo apt autoremove --purge
          EOF

          sudo cat <<EOF > /usr/local/bin/upgrade
          sudo apt upgrade
          EOF

          sudo cat <<EOF > /usr/local/bin/full-upgrade
          sudo apt full-upgrade
          EOF

          # --- NOT EXECUTABLE --- #

      - name: Updating APT
        run: |
          sudo apt update
      
      - name: Install QEMU x86_64
        if: ${{ inputs.inst_qemu_x64 }}
        run: |
          sudo apt install qemu-system-x86

      - name: Skip Install QEMU x86_64
        if: ${{ !inputs.inst_qemu_x64 }}
        run: |
          echo "Skipped."

      - name: Install QEMU PPC
        if: ${{ inputs.inst_qemu_ppc }}
        run: |
          sudo apt install qemu-system-ppc

      - name: Skip Install QEMU PPC
        if: ${{ !inputs.inst_qemu_ppc }}
        run: |
          echo "Skipped."

      - name: Install QEMU ARM
        if: ${{ inputs.inst_qemu_arm }}
        run: |
          sudo apt install qemu-system-aarch64

      - name: Skip Install QEMU ARM
        if: ${{ !inputs.inst_qemu_arm }}
        run: |
          echo "Skipped."
          
      - name: Installing QEMU Utility
        run: |
          sudo apt install qemu-utils -y

      - name: Install XFCE
        if: ${{ inputs.inst_xfce }}
        run: |
          sudo apt install xfce4 -y

      - name: Skip Installing XFCE
        if: ${{ !inputs.inst_xfce }}
        run: |
          echo "Skipped."

      - name: Install VNC Server
        if: ${{ inputs.inst_vnc }}
        run: |
          sudo apt install tightvncserver

      - name: Skip Installing VNC Server
        if: ${{ !inputs.inst_vnc }}
        run: |
          echo "Skipped."

      - name: Install Virt-Manager
        if: ${{ inputs.inst_vm_man }}
        run: |
          sudo apt install virt-manager libvirt-daemon libvirt-daemon-system -y
          sudo systemctl enable --now libvirtd

      - name: Skip Installing Virt-Manager
        if: ${{ !inputs.inst_vm_man }}
        run: |
          echo "Skipped."          
        
      - name: Create /runner-artifact directory
        run: |
          sudo mkdir -p /runner-artifact
          sudo chmod 777 /runner-artifact

      - name: Turning on NBD module
        run: |
          sudo modprobe nbd

      - name: Display Connection Info
        run: |
          RUNNER_IP=$(tailscale ip -4)
          echo "Run this in your terminal: ssh runner@$RUNNER_IP"
          echo "If you are completed on doing something and want to upload the artifact, run: touch /tmp/continue"

      - name: Hold Execution for SSH
        run: |
          while [ ! -f /tmp/continue ]; do
            sleep 5
          done

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          # Artifact name. If the `archive` input is `false`, the name of the file uploaded will be the artifact name.
          name: artifact # optional, default is artifact
          # A file, directory or wildcard pattern that describes what to upload.
          path: /runner-artifact/*

          include-hidden-files: false # optional, default is false
          # If true, the artifact will be archived (zipped) before uploading. If false, the artifact will be uploaded as-is without archiving. When `archive` is `false`, only a single file can be uploaded. The name of the file will be used as the artifact name (ignoring the `name` parameter).

          archive: true # optional, default is true
