name: QEMU x86_64 Runner

on:
  workflow_dispatch: 
    inputs:
      inst_qemu_x64:
        type: boolean
        description: 'Install QEMU x86_64'
        default: false
      inst_qemu_i386:
        type: boolean
        description: 'Install QEMU i386'
        default: true
        
jobs:
  debug-runner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Connect to Tailnet & Enable SSH
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          args: --ssh
    
      - name: Set PKG variable
        run: |
          PKG=qemu-util

      - name: Set Installing QEMU x86_64 Variable
        if: ${{ inputs.inst_qemu_x64 }}
        run: |
          PKG="$PKG qemu-system-x86_64"

      - name: Skipping QEMU x86_64 Set Variable
        if: ${{ !inputs.inst_qemu_x64 }}
        run: |
          PKG=$PKG
      
      - name: Set Installing QEMU i386 Variable
        if: ${{ inputs.inst_qemu_i386 }}
        run: |
          PKG="$PKG qemu-system-x86"

      - name: Skipping QEMU i386 Set Variable
        if: ${{ !inputs.inst_qemu_i386 }}
        run: |
          PKG=$PKG

      - name: Installing Packages
        run: |
          sudo apt install $PKG -y

      - name: Create /runner-artifact directory
        run: |
          sudo mkdir -p /runner-artifact
          sudo chmod 777 /runner-artifact

      - name: Turning on NBD module
        run: |
          sudo modprobe nbd

      - name: Display Connection Info
        run: |
          RUNNER_IP=$(tailscale ip -4)
          echo "Run this in your terminal: ssh runner@$RUNNER_IP"
          echo "If you are completed on doing something and want to upload the artifact, run: touch /tmp/continue"

      - name: Hold Execution for SSH
        run: |
          while [ ! -f /tmp/continue ]; do
            sleep 5
          done

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          # Artifact name. If the `archive` input is `false`, the name of the file uploaded will be the artifact name.
          name: artifact # optional, default is artifact
          # A file, directory or wildcard pattern that describes what to upload.
          path: /runner-artifact/*

          include-hidden-files: false # optional, default is false
          # If true, the artifact will be archived (zipped) before uploading. If false, the artifact will be uploaded as-is without archiving. When `archive` is `false`, only a single file can be uploaded. The name of the file will be used as the artifact name (ignoring the `name` parameter).

          archive: true # optional, default is true
      
      - name: Setup /releases & Parse Config
        id: parse
        run: |
          sudo mkdir -p /releases && sudo chown -R $USER:$USER /releases
          if [ -f "release.ini" ]; then
            cp release.ini /releases/
          else
            echo "Error: file release.ini not found!"
            exit 1
          fi
          
          python3 - << 'EOF'
          import configparser, os
          c = configparser.ConfigParser()
          c.read('/releases/release.ini')
          
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"tag={c.get('release', 'tag', fallback='v1.0.0')}\n")
              f.write(f"title={c.get('release', 'title', fallback='Release')}\n")
              
              body = c.get('release', 'body', fallback='')
              f.write(f"body<<EOF\n{body}\nEOF\n")
              
              files = [f"/releases/{x.strip()}" for x in c.get('release', 'files', fallback '').splitlines() if x.strip()]
              f.write(f"files<<EOF\n{'\n'.join(files)}\nEOF\n")
          EOF

      - name: Auto Tag
        run: |
          git config user.name "github-actions[bot]" && git config user.email "bot@noreply.github.com"
          git rev-parse "${{ steps.parse.outputs.tag }}" || (git tag "${{ steps.parse.outputs.tag }}" && git push origin "${{ steps.parse.outputs.tag }}")

      - name: Upload ke GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.parse.outputs.tag }}
          name: ${{ steps.parse.outputs.title }}
          body: ${{ steps.parse.outputs.body }}
          files: ${{ steps.parse.outputs.files }}
          
