name: QEMU x86_64 Runner

on:
  workflow_dispatch: 
    inputs:
      inst_qemu_x64:
        type: boolean
        description: 'Install QEMU x86_64'
        default: true
      inst_qemu_ppc:
        type: boolean
        description: 'Install QEMU PPC (PowerPC)'
        default: false
      inst_qemu_arm:
        type: boolean
        description: 'Install QEMU ARM'
        default: false
      inst_xfce:
        type: boolean
        description: 'Install XFCE'
        default: false
      inst_vnc:
        type: boolean
        description: 'Install VNC Server'
        default: true
      inst_vm_man:
        type: boolean
        description: 'Install Virt-Manager'
        default: true
      add_nt_iso_coll:
        type: boolean
        description: 'Add Old Windows NT ISO Collection'
        default: false

jobs:
  debug-runner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Connect to Tailnet & Enable SSH
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          args: --ssh

      - name: Create Custom Command
        run: |
          sudo cat <<EOF > /usr/local/bin/update
          sudo apt update
          EOF

          sudo cat <<EOF > /usr/local/bin/clean
          sudo apt clean
          EOF

          sudo cat <<EOF > /usr/local/bin/autoclean
          sudo apt autoclean
          EOF

          sudo cat <<EOF > /usr/local/bin/autorm-w-purge
          sudo apt autoremove --purge
          EOF

          sudo cat <<EOF > /usr/local/bin/upgrade
          sudo apt upgrade
          EOF

          sudo cat <<EOF > /usr/local/bin/full-upgrade
          sudo apt full-upgrade
          EOF

          # --- NOT EXECUTABLE --- #

      - name: Updating APT
        run: |
          sudo apt update
      
      - name: Install QEMU x86_64
        if: ${{ inputs.inst_qemu_x64 }}
        run: |
          sudo apt install qemu-system-x86

      - name: Skip Install QEMU x86_64
        if: ${{ !inputs.inst_qemu_x64 }}
        run: |
          echo "Skipped."

      - name: Install QEMU PPC
        if: ${{ inputs.inst_qemu_ppc }}
        run: |
          sudo apt install qemu-system-ppc

      - name: Skip Install QEMU PPC
        if: ${{ !inputs.inst_qemu_ppc }}
        run: |
          echo "Skipped."

      - name: Install QEMU ARM
        if: ${{ inputs.inst_qemu_arm }}
        run: |
          sudo apt install qemu-system-aarch64

      - name: Skip Install QEMU ARM
        if: ${{ !inputs.inst_qemu_arm }}
        run: |
          echo "Skipped."
          
      - name: Installing QEMU Utility
        run: |
          sudo apt install qemu-utils -y

      - name: Install XFCE
        if: ${{ inputs.inst_xfce }}
        run: |
          sudo apt install xfce4 -y

      - name: Skip Installing XFCE
        if: ${{ !inputs.inst_xfce }}
        run: |
          echo "Skipped."

      - name: Install VNC Server
        if: ${{ inputs.inst_vnc }}
        run: |
          sudo apt install tightvncserver

      - name: Skip Installing VNC Server
        if: ${{ !inputs.inst_vnc }}
        run: |
          echo "Skipped."

      - name: Install Virt-Manager
        if: ${{ inputs.inst_vm_man }}
        run: |
          sudo apt install virt-manager libvirt-daemon libvirt-daemon-system -y
          sudo systemctl enable --now libvirtd

      - name: Skip Installing Virt-Manager
        if: ${{ !inputs.inst_vm_man }}
        run: |
          echo "Skipped."

      - name: Download Old Windows NT ISO Collection
        if: ${{ inputs.add_nt_iso_coll }}
        run: |
          sudo apt install p7zip-full -y
          sudo mkdir /win-nt
          sudo chown runner:runner /win-nt
          cd /win-nt
          # --- START OF WINDOWS NT 3.1 SECTION --- #
          mkdir -p 3.1/adv-serv 3.1/wkst
          # --- WINDOWS NT 3.1 ADVANCED SERVER --- #
          cd 3.1/adv-serv
          wget https://dl-alt1.winworldpc.com/Microsoft%20Windows%20NT%203.1%20Advanced%20Server%20(3.10.5098.1)%20(ISO).7z -O adv-serv.7z
          7z x adv-serv.7z
          rm adv-serv.7z
          # --- WINDOWS NT 3.1 WORKSTATION --- #
          cd ../wkst
          wget https://dl-alt1.winworldpc.com/Microsoft%20Windows%20NT%203.1%20Workstation%20(3.10.511.1)%20(ISO).7z -O wkst.7z
          7z x wkst.7z
          rm wkst.7z
          # --- END OF WINDOWS NT 3.1 SECTION --- #
          cd ../..
          # --- START OF WINDOWS NT 3.5 SECTION --- #
          mkdir -p 3.5
          cd 3.5
          mkdir -p serv wkst
          # --- WINDOWS NT 3.5 SERVER --- #
          cd serv
          wget https://dl-alt1.winworldpc.com/Abandonware%20Operating%20Systems/PC/Microsoft%20Windows/Windows%20NT3/Microsoft%20Windows%20NT%203.5%20Server%20(3.50.800.1).7z -O serv.7z
          7z x serv.7z
          rm serv.7z
          # --- WINDOWS NT 3.5 WORKSTATION --- #
          cd ../wkst
          wget https://dl-alt1.winworldpc.com/Abandonware%20Operating%20Systems/PC/Microsoft%20Windows/Windows%20NT3/Microsoft%20Windows%20NT%203.5%20Workstation%20(3.50.807).7z -O wkst.7z
          7z x wkst.7z
          rm wkst.7z
          # --- END OF WINDOWS NT 3.5 SECTION --- #
          cd ../..
          # --- START OF WINDOWS NT 3.51 SECTION --- #
          mkdir -p 3.51
          cd 3.51
          mkdir -p vm wkst serv
          # --- WINDOWS NT 3.51 VM --- #
          cd vm
          wget https://dl-alt1.winworldpc.com/Abandonware%20Operating%20Systems/Virtual%20Machines/Microsoft%20Windows/Microsoft%20Windows%20NT%203.51%20VM.7z -O vm.7z
          7z x vm.7z
          rm vm.7z
          # --- WINDOWS NT 3.51 WORKSTATION --- #
          cd ../wkst
          wget https://dl-alt1.winworldpc.com/Abandonware%20Operating%20Systems/PC/Microsoft%20Windows/Windows%20NT3/Microsoft%20Windows%20NT%203.51%20Workstation%20(3.51.1057.1).7z -O wkst.7z
          7z x wkst.7z
          rm wkst.7z
          # --- WINDOWS NT 3.51 SERVER --- #
          cd ../serv
          wget https://dl-alt1.winworldpc.com/Microsoft%20Windows%20NT%203.51%20Server%20(3.51.1057.1)%20(ISO).7z -O serv.7z
          7z x serv.7z
          rm serv.7z
          # --- END OF WINDOWS NT 3.51 SECTION --- #
          cd $HOME
          

      - name: Skip Downloading Old Windows NT ISO Collection
        if: ${{ !inputs.add_nt_iso_coll }}
        run: |
          echo "Skipped."
        
      - name: Create /runner-artifact directory
        run: |
          sudo mkdir -p /runner-artifact
          sudo chmod 777 /runner-artifact

      - name: Turning on NBD module
        run: |
          sudo modprobe nbd

      - name: Display Connection Info
        run: |
          RUNNER_IP=$(tailscale ip -4)
          echo "Run this in your terminal: ssh runner@$RUNNER_IP"
          echo "If you are completed on doing something and want to upload the artifact, run: touch /tmp/continue"

      - name: Hold Execution for SSH
        run: |
          while [ ! -f /tmp/continue ]; do
            sleep 5
          done

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          # Artifact name. If the `archive` input is `false`, the name of the file uploaded will be the artifact name.
          name: artifact # optional, default is artifact
          # A file, directory or wildcard pattern that describes what to upload.
          path: /runner-artifact/*

          include-hidden-files: false # optional, default is false
          # If true, the artifact will be archived (zipped) before uploading. If false, the artifact will be uploaded as-is without archiving. When `archive` is `false`, only a single file can be uploaded. The name of the file will be used as the artifact name (ignoring the `name` parameter).

          archive: true # optional, default is true
